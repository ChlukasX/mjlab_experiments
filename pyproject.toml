[project]
name = "mjlab-piplus"
version = "0.1.0"
description = "Pi+ humanoid balance experiments with mjlab (MuJoCo + RSL-RL + PPO)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ChlukasX", email = "me@chlukas.xyz" }
]
requires-python = ">=3.13"
dependencies = [
    "mjlab==1.6.0",
]

[project.scripts]
mjx = "mjlab_piplus:main"

[project.entry-points."mjlab.tasks"]
mjlab_piplus = "mjlab_piplus.tasks"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
